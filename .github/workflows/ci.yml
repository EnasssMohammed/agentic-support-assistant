name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      # Tests that need a live Ollama/OpenAI model are marked `requires_llm`
      # (see tests/conftest.py) and are excluded here - a CI runner has no model.
      - name: Test (deterministic unit tests only)
        run: uv run pytest -m "not requires_llm" -v
