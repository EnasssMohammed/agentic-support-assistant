[project]
name = "velo-ai-agent"
version = "1.0.0"
description = "Velo — a domain-agnostic, policy-grounded agentic technical-support assistant (retrieval + diagnostics + bounded resolution + escalation)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "langchain>=1.4.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.2",
    "langgraph>=1.2.11",
    "streamlit>=1.63.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]